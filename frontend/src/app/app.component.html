<div class="toast" [class.toast-visible]="toastVisible">
  <span class="toast-icon">&#10003;</span> {{ toast }}
</div>

<div class="container">
  <div class="card">
    <div class="header">
      <h1>Pocket Pirate</h1>
      <p class="subtitle">Paste a video URL and download as MP3 or MP4</p>
    </div>

    <div class="input-group">
      <input
        type="url"
        [(ngModel)]="url"
        placeholder="https://www.youtube.com/watch?v=..."
        class="url-input"
        (keyup.enter)="!loading && download('mp3')"
        [disabled]="loading"
      />
    </div>

    <div class="progress-section" *ngIf="loading">
      <div class="progress-info">
        <span class="progress-pct">{{ progress }}%</span>
        <span class="progress-status">{{ status === 'converting' ? 'Converting…' : 'Downloading…' }}</span>
        <span class="progress-timer">{{ elapsedDisplay }}</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" [style.width.%]="progress"></div>
      </div>
    </div>

    <div class="button-group">
      <button class="btn btn-audio" (click)="download('mp3')" [disabled]="loading">
        Download MP3
      </button>
      <button class="btn btn-video" (click)="download('mp4')" [disabled]="loading">
        Download MP4
      </button>
    </div>

    <div class="error" *ngIf="error">
      {{ error }}
    </div>
  </div>
</div>
